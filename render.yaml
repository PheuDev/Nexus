services:
  - type: web
    name: nexus-pheu
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/PheuDev/Nexus.git
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health.php
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        sync: false
