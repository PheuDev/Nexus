services:
  - type: web
    name: nexus-pheu
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/PheuDev/Nexus.git
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health.php
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-postgres
          property: connectionString

databases:
  - name: nexus-postgres
    databaseName: nexus
    user: nexus
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
